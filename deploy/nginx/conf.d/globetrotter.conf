# Container-level nginx.
#
# This VPS already runs a host nginx that owns ports 80/443 and terminates TLS
# for several other sites. So this server block speaks plain HTTP on an internal
# port and leaves certificates to the host proxy. It serves the Flutter web
# build and forwards API calls to the backend container.
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    root /usr/share/nginx/html;
    index index.html;

    # Matched before the single-page-app fallback so the API is never shadowed.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Carried over from the host proxy so the backend sees the real scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://backend:5000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Build assets have hashed names, so they are safe to cache for a long time.
    location ~* \.(?:js|css|png|jpe?g|gif|webp|svg|woff2?|ttf|otf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html must not be cached, or browsers keep requesting asset names
    # from a previous build that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
